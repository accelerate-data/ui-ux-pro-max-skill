name: Sync upstream ui-ux-pro-max-skill

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Create sync branch
        run: git checkout -B sync/upstream-ui-ux-pro-max-skill

      - name: Merge upstream
        run: git merge upstream/main --no-edit

      - name: Validate wrapper files
        run: |
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m json.tool .codex-plugin/plugin.json >/dev/null
          test -d .claude/skills
          find .claude/skills -name SKILL.md -type f | grep -q .

      - name: Push sync branch
        run: git push origin sync/upstream-ui-ux-pro-max-skill --force-with-lease

      - name: Open sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view sync/upstream-ui-ux-pro-max-skill --json number >/dev/null 2>&1 || \
            gh pr create \
              --base main \
              --head sync/upstream-ui-ux-pro-max-skill \
              --title "Sync upstream nextlevelbuilder/ui-ux-pro-max-skill" \
              --body-file - <<'BODY'
            Automated sync from `nextlevelbuilder/ui-ux-pro-max-skill`.

            Review vendored skill changes before merge.
          BODY
